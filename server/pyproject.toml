[project]
name = "server"
version = "0.1.0"
description = "本地开发后端骨架：FastAPI + Celery + SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "celery>=5.4",
    "langchain>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
