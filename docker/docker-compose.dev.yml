services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-flow-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_flow}
      POSTGRES_USER: ${POSTGRES_USER:-ai_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_flow}
    ports:
      - "${DEVCTL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    image: python:3.12-slim
    working_dir: /app/server
    volumes:
      - ../server:/app/server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_flow:ai_flow@postgres:5432/ai_flow}
    command: sh -c "pip install -q uv && uv sync && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy

  celery:
    image: python:3.12-slim
    working_dir: /app/server
    volumes:
      - ../server:/app/server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_flow:ai_flow@postgres:5432/ai_flow}
    command: sh -c "pip install -q uv && uv sync && celery -A src.celery_app:app worker -l info"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
